# windows-powershell only. Loaded explicitly with -f; never source tmux.conf.
set -g default-shell pwsh
set -g warm off
set -g prediction-dimming off
set -g default-terminal xterm-256color
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi
set -g set-clipboard on
set -g escape-time 1
set -g prefix C-Space
bind C-Space send-prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r M-h select-window -t :-
bind -r C-BSpace select-window -t :-
bind -r C-l select-window -t :+
# Native foreground process detection; no Unix ps/grep or synthetic pane_tty.
bind -n C-h if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n C-h' "if-shell -F '#{m/ri:(^|[/\\ ])(g?view|g?n?vim|fzf)([.]exe)?( |$),#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'"
# WezTerm transports Ctrl+h as Alt+h to avoid ConPTY Backspace decoding.
bind -n M-h if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n C-h' "if-shell -F '#{m/ri:(^|[/\\ ])(g?view|g?n?vim|fzf)([.]exe)?( |$),#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'"
# Alias for terminal paths that report Ctrl+H as Ctrl+Backspace; plain Backspace stays unchanged.
bind -n C-BSpace if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n C-h' "if-shell -F '#{m/ri:(^|[/\\ ])(g?view|g?n?vim|fzf)([.]exe)?( |$),#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'"
bind -n C-j if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n C-j' "if-shell -F '#{m/ri:(^|[/\\ ])(g?view|g?n?vim|fzf)([.]exe)?( |$),#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'"
bind -n C-k if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n C-k' "if-shell -F '#{m/ri:(^|[/\\ ])(g?view|g?n?vim|fzf)([.]exe)?( |$),#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'"
bind -n C-l if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n C-l' "if-shell -F '#{m/ri:(^|[/\\ ])(g?view|g?n?vim|fzf)([.]exe)?( |$),#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'"
# Escape can stall after repeated control input in an insert-mode ConPTY pane.
# Use Neovim's normal-mode chord only while its InsertEnter marker is active.
bind -n Escape if-shell -F '#{==:#{pane_current_command},nvim-insert}' 'send-keys C-\ C-n' 'send-keys Escape'
bind C-p previous-window
bind C-n next-window
bind -r n next-window
bind -r p previous-window
bind Space last-window
bind ^ switch-client -l
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi q send-keys -X rectangle-toggle
# psmux copy-selection uses the Windows clipboard directly.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ' #{session_name}  '
set -g status-right '#{pane_title} '
set -g status-style 'fg=#7C7D83,bg=#242631'
set -g window-status-format '#{window_index}:#{pane_current_command}#{window_flags} '
set -g window-status-current-format '#{window_index}:#{pane_current_command}#{window_flags} '
set -g window-status-current-style 'fg=#E9E9EA'

# Profile-loaded project commands keep user t overrides and the source checkout.
bind -r F new-window -c '#{pane_current_path}' 'pwsh -NoLogo -NoExit -Command t'
bind -r D new-window 'pwsh -NoLogo -NoExit -Command Invoke-DotfilesConfigProject'
